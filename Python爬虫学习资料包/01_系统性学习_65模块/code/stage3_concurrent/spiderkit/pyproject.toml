[project]
name = "spiderkit"
version = "1.0.0"
description = "工程化异步爬虫工具包 —— 阶段 3 毕业项目"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "parsel>=1.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[project.scripts]
spiderkit = "spiderkit.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spiderkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# UP042: str+Enum 是有意保留的写法，兼容 JSON 序列化与字符串比较
ignore = ["ANN401", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]
